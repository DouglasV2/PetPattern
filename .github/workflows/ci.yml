name: CI

# Quality gate for PetPattern. Runs on pull requests and on pushes to the main/release branches.
# Fails the build on: any test failure, a production-build failure, a failed DB migration boot, a
# high/critical PRODUCTION dependency vulnerability, or a committed secret / prohibited release file.
# No secrets are referenced here — the migration job uses the compose dev defaults only.

on:
  pull_request:
  push:
    branches: [main, 'release/**', 'feature/**']

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — tests, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Clean install
        run: npm ci
      - name: Lint (if configured)
        run: |
          if npm run | grep -qE '^  lint'; then npm run lint; else echo "no lint script configured — skipping"; fi
      - name: Unit + integration tests
        run: npx vitest run
      - name: Production build
        run: npm run build
      - name: Dependency audit (production, fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend — wrapper build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Uses the committed Maven wrapper — no globally installed Maven required.
      - name: Compile + run all tests
        run: ./mvnw --batch-mode clean test
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  migrations:
    name: DB migrations — clean boot validates Flyway V1..V15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bringing up Postgres + the backend applies every Flyway migration on a FRESH database;
      # a broken/missing migration fails the boot and the health check below never turns UP.
      - name: Boot Postgres + backend (applies migrations)
        run: docker compose up -d --build postgres backend
      - name: Wait for backend health (migrations applied)
        run: |
          for i in $(seq 1 60); do
            status=$(curl -sf http://localhost:8317/actuator/health | grep -o '"status":"UP"' || true)
            if [ -n "$status" ]; then echo "backend UP — migrations applied"; exit 0; fi
            sleep 5
          done
          echo "backend did not become healthy — migration or boot failure" >&2
          docker compose logs backend | tail -80
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v

  release-hygiene:
    name: Release hygiene — secret scan + prohibited-path gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ops/make-release.sh fails closed on any tracked secret file, a secret PATTERN in the
      # archived content, or a prohibited path (.env / node_modules / target / dist / keystores /
      # .claude / *;C). It prints only file paths, never values.
      - name: Build + verify release archive
        run: bash ops/make-release.sh
      - name: Guard against committed secrets / signing material
        run: |
          if git ls-files | grep -iE '(^|/)\.env$|\.jks$|\.keystore$|\.p12$|\.pem$|key\.properties$|google-services\.json$|GoogleService-Info\.plist$'; then
            echo "A secret/signing file is tracked in git." >&2
            exit 1
          fi
          echo "no tracked secret/signing files"
