server:
  port: 8080
  error:
    # Surface the reason phrase (e.g. "Email or password is incorrect") to the
    # client so the UI can show a helpful message instead of a generic 4xx.
    include-message: always

spring:
  application:
    name: petpattern-backend
  datasource:
    url: jdbc:postgresql://localhost:15437/petpattern
    username: petpattern
    password: petpattern
    hikari:
      # Explicit pool sizing (Hikari's default is 10). Headroom for the ~20-user
      # target; queries are short + indexed so this is comfortable. Keep well under
      # Postgres max_connections (default 100). connection-timeout fails a starved
      # request in 10s instead of the 30s default.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 10000
  jpa:
    hibernate:
      # Flyway owns the schema now; Hibernate only validates that entities match it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    # Existing databases (built earlier by ddl-auto) are baselined at V1 instead
    # of re-running it; fresh databases run V1 to create the schema.
    baseline-on-migrate: true
    baseline-version: 1
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # Photos are resized on the client before upload; these caps are headroom.
      max-file-size: 10MB
      max-request-size: 12MB

management:
  endpoints:
    web:
      exposure:
        # Only health is exposed (no env/metrics/heapdump leaking to the network).
        include: health
  endpoint:
    health:
      # Never leak DB/component internals in the health body.
      show-details: never
      probes:
        # /actuator/health/liveness and /readiness for orchestration.
        enabled: true
  health:
    mail:
      # Do NOT let the SMTP server gate app health. spring-boot-starter-mail
      # auto-registers a MailHealthIndicator that connects to SMTP on every
      # /actuator/health call; a down/absent mail server would flip health to
      # DOWN and (in prod) block the health-gated startup. Mail is an optional,
      # non-critical side feature, so its reachability must not fail the app.
      enabled: false

# Error tracking (optional). Empty DSN = disabled, so dev needs no config; set
# SENTRY_DSN in prod to enable. PII is never sent: no user email, cookies,
# headers, or request bodies leave the app.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  send-default-pii: false
  max-request-body-size: none
  # Performance tracing off by default (set >0 to sample transactions).
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}

petpattern:
  # Public origin the app is served at — used to build the password-reset link and
  # (via PETPATTERN_CORS_ALLOWED_ORIGINS in prod) CORS. Dev default is the SPA port.
  public-origin: ${PUBLIC_ORIGIN:http://localhost:7317}
  mail:
    # false (default) = don't send; log the reset link (dev only). true = send via
    # the SPRING_MAIL_* provider (host/port/username/password must be set).
    enabled: ${PETPATTERN_MAIL_ENABLED:false}
    from: ${PETPATTERN_MAIL_FROM:PetPattern <no-reply@petpattern.app>}
  reset:
    # How long a password-reset link stays valid.
    token-ttl-minutes: ${PETPATTERN_RESET_TTL_MINUTES:60}
  demo:
    # The unauthenticated "Load Bella demo" seed. Safe to leave on for a beta
    # (it's rate-limited); set false to remove it entirely in production.
    enabled: ${PETPATTERN_DEMO_ENABLED:true}
  security:
    # Set true in production (https) so the session cookie is TLS-only.
    cookie-secure: ${PETPATTERN_COOKIE_SECURE:false}
  google:
    # "Continue with Google" (optional). All three must be set to enable it;
    # otherwise /api/auth/google/** returns 404 and the UI shows no Google button.
    # The redirect URI must EXACTLY match an Authorized redirect URI on the Google
    # OAuth client. Secrets live in .env (gitignored), never in the repo.
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:7317/api/auth/google/callback}
  cors:
    # Localhost is only the dev default; prod sets PETPATTERN_CORS_ALLOWED_ORIGINS.
    allowed-origins: ${PETPATTERN_CORS_ALLOWED_ORIGINS:http://localhost:7317,http://127.0.0.1:7317}
  ai:
    # "mock" (deterministic local reader, default) or "anthropic" (hosted model).
    provider: ${PETPATTERN_AI_PROVIDER:mock}
    # Empty by default; set ANTHROPIC_API_KEY to enable the hosted provider.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${PETPATTERN_AI_MODEL:claude-haiku-4-5}
