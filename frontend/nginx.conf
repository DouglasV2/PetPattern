server {
  listen 0.0.0.0:${PORT};
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers (applied to every response; locations add no headers of their
  # own, so these are inherited). HSTS is only honoured over HTTPS — the TLS
  # reverse proxy in front forwards it.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  # SPA-tuned CSP. frame-ancestors 'none' blocks clickjacking; connect-src allows
  # same-origin /api plus any https Sentry/analytics endpoint (both optional/off by
  # default). style 'unsafe-inline' covers React inline styles; img data:/blob:
  # covers the client-side photo resize canvas.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

  location /api/ {
    # Allow photo uploads (default would cap the body at 1MB).
    client_max_body_size 12m;
    # Upstream is substituted at container start (nginx envsubst on templates).
    # Default "backend:8080" suits docker-compose; on Railway/other hosts set
    # BACKEND_UPSTREAM to the backend's internal host:port.
    proxy_pass http://${BACKEND_UPSTREAM}/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
