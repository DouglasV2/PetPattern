<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="PetPattern">
  <!-- App icon: a paw whose pads sit on a small memory trail. One coral pad marks the change. -->
  <rect width="48" height="48" rx="12" fill="#2f766d"/>
  <!-- memory trail: a quiet dotted path from the record (palm) up to the changed pad -->
  <path d="M24 31 C 28.5 27.5, 31.5 25.5, 33.4 21.6" fill="none" stroke="#f6f7f3" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="0.4 3.4" opacity="0.72"/>
  <!-- three steady toe pads -->
  <circle cx="14.9" cy="21.3" r="3.5" fill="#f6f7f3"/>
  <circle cx="20.7" cy="16.7" r="3.5" fill="#f6f7f3"/>
  <circle cx="27.3" cy="16.7" r="3.5" fill="#f6f7f3"/>
  <!-- the changed point -->
  <circle cx="33.1" cy="21.3" r="3.5" fill="#c75b46"/>
  <!-- palm pad: the record everything sits on -->
  <path d="M24 24.4c4.3 0 7.5 3.1 7.5 6.8 0 3.1-3 4.8-7.5 4.8s-7.5-1.7-7.5-4.8c0-3.7 3.2-6.8 7.5-6.8z" fill="#f6f7f3"/>
</svg>
