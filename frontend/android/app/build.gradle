apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------------------------
// Release signing. Everything secret lives in an UNTRACKED android/key.properties (see
// docs/android-release.md); key.properties, *.jks and *.keystore are all gitignored. When the file
// is absent (CI, a fresh clone, any dev machine) the release build simply stays UNSIGNED rather
// than failing — but `bundleRelease` then produces an artifact Play will reject, which is the loud,
// correct outcome. Never commit a keystore or its passwords.
// ---------------------------------------------------------------------------------------------
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.exists()
if (hasSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "app.petpattern.mobile"
    compileSdk = rootProject.ext.compileSdkVersion

    signingConfigs {
        release {
            if (hasSigningConfig) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "app.petpattern.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Bumped per release from android/variables.gradle so there is ONE place to edit and no
        // hunting through build files. Play rejects an upload whose versionCode was not increased.
        versionCode rootProject.ext.appVersionCode
        versionName rootProject.ext.appVersionName
        // App Links host. Empty by default: we must not claim a domain we do not own, and
        // autoVerify against an unowned host fails verification at install time. Set a real domain
        // (and serve /.well-known/assetlinks.json from it) to turn https deep links on:
        //   ./gradlew bundleRelease -PappLinksHost=app.yourdomain.com
        // The petpattern:// custom scheme keeps working regardless. See docs/android-release.md.
        manifestPlaceholders = [
            appLinksHost      : rootProject.ext.appLinksHost,
            appLinksAutoVerify: rootProject.ext.appLinksAutoVerify
        ]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            // Only attach the signing config when key.properties is actually present, so a build
            // without it produces a clearly-unsigned artifact instead of failing to configure.
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
